<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Категории новостей</title>
</head>
<body>
    {% extends 'base.html' %}
    {% block content %}
        <h2>Категории новостей</h2>
        <a href="{{ url_for('add_category') }}">Добавить категорию</a>
        <ul>
            {% for category in categories %}
            <li>
                {{ category.id }}. {{ category.name }} <a href="{{ url_for('edit_category', id=category.id) }}">Редактировать</a>
            </li>
            {% endfor %}
        </ul>
    {% endblock %}
</body>
</html>
