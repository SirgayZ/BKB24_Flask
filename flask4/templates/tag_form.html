<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Теги новостей</title>
</head>
<body>
{% extends 'base.html' %}
{% block content %}
  <h2>Создать тег</h2>
  <form method="POST">
    {{ form.hidden_tag() }}
    <div class="mb-3">
      {{ form.name.label }}<br>
      {{ form.name() }}
      {% for error in form.name.errors %}
      <span style="color: red;">[{{ error }}]</span>
      {% endfor %}
    </div>
    <p>{{ form.submit() }}</p>
  </form>
{% endblock %}
</body>
</html>
