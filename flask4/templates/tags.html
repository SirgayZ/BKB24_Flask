<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Теги новостей</title>
</head>
<body>
    {% extends 'base.html' %}
    {% block content %}
        <h2>Теги новостей</h2>
        <a href="{{ url_for('add_tag') }}">Добавить тег</a>
        <ul>
            {% for tag in tags %}
            <li>
                {{ tag.id }}. {{ tag.name }} <a href="{{ url_for('edit_tag', id=tag.id) }}">Редактировать</a>
            </li>
            {% endfor %}
        </ul>
    {% endblock %}
</body>
</html>
